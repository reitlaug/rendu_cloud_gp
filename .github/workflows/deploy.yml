name: CI/CD - Pipeline Documents

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. Vérification du code (lint / compile)
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint Python
        run: |
          pip install flake8
          flake8 functions api --max-line-length=120 --extend-ignore=E501,W503 || true
          python -m py_compile functions/function_app.py api/main.py

  # ---------------------------------------------------------------------------
  # 2. Build + déploiement du frontend React (Azure Static Web Apps)
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APP_TOKEN }}
          action: upload
          app_location: "frontend/dist"
          skip_app_build: true

  # ---------------------------------------------------------------------------
  # 3. Déploiement des Azure Functions
  # ---------------------------------------------------------------------------
  functions:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd functions
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"
      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          package: "functions"
          scm-do-build-during-deployment: true
          enable-oryx-build: true
